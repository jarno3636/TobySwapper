name: Repair Lore Cache

on:
  workflow_dispatch:
    inputs:
      metadata_workers:
        description: "Metadata workers"
        required: true
        default: "1"

      art_workers:
        description: "Artwork workers"
        required: true
        default: "2"

      passes:
        description: "Repair passes"
        required: true
        default: "3"

      metadata_timeout_ms:
        description: "Metadata gateway timeout"
        required: true
        default: "18000"

      image_timeout_ms:
        description: "Artwork gateway timeout"
        required: true
        default: "30000"

      image_race_width:
        description: "Artwork gateways raced at once"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  repair:
    name: Repair missing Lore data

    runs-on: ubuntu-latest

    timeout-minutes: 240

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

      LORE_ART_BUCKET: tobyswap-lore-art

      # Optional.
      # If you ever add a dedicated gateway secret,
      # this script will automatically prefer it.
      IPFS_PRIMARY_GATEWAY: ${{ secrets.IPFS_PRIMARY_GATEWAY }}

      IPFS_GATEWAYS: "https://gateway.pinata.cloud/ipfs/,https://ipfs.io/ipfs/,https://dweb.link/ipfs/,https://w3s.link/ipfs/,https://nftstorage.link/ipfs/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate configuration
        shell: bash

        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "Missing SUPABASE_URL"
            exit 1
          fi

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && [ -z "${SUPABASE_SECRET_KEY:-}" ]; then
            echo "Missing Supabase server key"
            exit 1
          fi

          if [ -z "${BASE_RPC_URL:-}" ]; then
            echo "BASE_RPC_URL is not configured."
            echo "Public Base fallback will still be available."
          else
            echo "Dedicated Base RPC configured."
          fi

          if [ -z "${IPFS_PRIMARY_GATEWAY:-}" ]; then
            echo "No dedicated IPFS gateway configured."
            echo "Using public gateway race."
          else
            echo "Dedicated IPFS gateway configured."
          fi

      - name: Repair missing metadata and artwork
        shell: bash

        run: |
          set -euo pipefail

          node scripts/repair-lore-supabase.mjs \
            --metadata-workers=${{ inputs.metadata_workers }} \
            --art-workers=${{ inputs.art_workers }} \
            --passes=${{ inputs.passes }} \
            --metadata-timeout-ms=${{ inputs.metadata_timeout_ms }} \
            --image-timeout-ms=${{ inputs.image_timeout_ms }} \
            --image-race-width=${{ inputs.image_race_width }}

      - name: Run summary
        if: always()

        shell: bash

        run: |
          echo "## Tobyworld Lore Repair" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata workers: ${{ inputs.metadata_workers }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artwork workers: ${{ inputs.art_workers }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Repair passes: ${{ inputs.passes }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata timeout: ${{ inputs.metadata_timeout_ms }} ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artwork timeout: ${{ inputs.image_timeout_ms }} ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway race width: ${{ inputs.image_race_width }}" >> "$GITHUB_STEP_SUMMARY"
