name: Lore Supabase Backfill

on:
  workflow_dispatch:
    inputs:
      from_token:
        description: "First Lore deed ID"
        required: true
        default: "30"
      to_token:
        description: "Last Lore deed ID"
        required: true
        default: "30"
      concurrency:
        description: "Workers (1-4 recommended)"
        required: true
        default: "1"
      force_refresh:
        description: "Replace already cached records"
        required: true
        type: boolean
        default: false
      metadata_only:
        description: "Skip artwork upload"
        required: true
        type: boolean
        default: false
      metadata_timeout_ms:
        description: "Metadata timeout per gateway (ms)"
        required: true
        default: "6000"
      image_timeout_ms:
        description: "Artwork timeout per gateway (ms)"
        required: true
        default: "6500"

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill Lore
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

      # Public IPFS gateways used as fallbacks.
      # The script rotates the first gateway by token ID so one provider
      # does not receive the entire load.
      IPFS_GATEWAYS: "https://w3s.link/ipfs/,https://dweb.link/ipfs/,https://nftstorage.link/ipfs/,https://ipfs.io/ipfs/,https://gateway.pinata.cloud/ipfs/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing GitHub secret: SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing GitHub secret: SUPABASE_SERVICE_ROLE_KEY" && exit 1)

          if [ -z "$BASE_RPC_URL" ]; then
            echo "BASE_RPC_URL is not set. Public Base fallback will be used."
          else
            echo "Dedicated BASE_RPC_URL is configured."
          fi

          echo "Configured IPFS gateways:"
          echo "$IPFS_GATEWAYS" | tr ',' '\n'

      - name: Backfill Lore
        shell: bash
        run: |
          EXTRA_ARGS=""

          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force=true"
          fi

          if [ "${{ inputs.metadata_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --metadata-only=true"
          fi

          npm run backfill:lore -- \
            --from=${{ inputs.from_token }} \
            --to=${{ inputs.to_token }} \
            --concurrency=${{ inputs.concurrency }} \
            --metadata-timeout-ms=${{ inputs.metadata_timeout_ms }} \
            --image-timeout-ms=${{ inputs.image_timeout_ms }} \
            --retry-art=true \
            $EXTRA_ARGS

      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "## Tobyworld Lore Backfill" >> "$GITHUB_STEP_SUMMARY"
          echo "- Range: **${{ inputs.from_token }} → ${{ inputs.to_token }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers: **${{ inputs.concurrency }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Replace cached: **${{ inputs.force_refresh }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata only: **${{ inputs.metadata_only }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata timeout/gateway: **${{ inputs.metadata_timeout_ms }} ms**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artwork timeout/gateway: **${{ inputs.image_timeout_ms }} ms**" >> "$GITHUB_STEP_SUMMARY"
