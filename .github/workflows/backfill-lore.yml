name: Backfill Lore

on:
  workflow_dispatch:
    inputs:
      from_token:
        description: "First Lore deed ID"
        required: true
        default: "1"

      to_token:
        description: "Last Lore deed ID"
        required: true
        default: "2869"

      concurrency:
        description: "Token workers"
        required: true
        default: "3"

      image_timeout_ms:
        description: "Artwork timeout per gateway"
        required: true
        default: "15000"

      image_race_width:
        description: "Gateways raced at once"
        required: true
        default: "2"

      retry_art:
        description: "Retry failed artwork"
        type: boolean
        required: true
        default: true

      metadata_only:
        description: "Skip artwork"
        type: boolean
        required: true
        default: false

      force_refresh:
        description: "Replace cached records"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  backfill:
    name: Backfill Lore
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}

      LORE_ART_BUCKET: tobyswap-lore-art

      IPFS_GATEWAYS: "https://ipfs.io/ipfs/,https://dweb.link/ipfs/,https://w3s.link/ipfs/,https://nftstorage.link/ipfs/,https://gateway.pinata.cloud/ipfs/"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SUPABASE_URL" || {
            echo "Missing SUPABASE_URL"
            exit 1
          }

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Missing Supabase server key"
            exit 1
          fi

          if [ -z "$BASE_RPC_URL" ]; then
            echo "BASE_RPC_URL not set; script will use Base public fallback."
          else
            echo "Dedicated Base RPC configured."
          fi

      - name: Backfill Lore
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=""

          if [ "${{ inputs.retry_art }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --retry-art=true"
          else
            EXTRA_ARGS="$EXTRA_ARGS --retry-art=false"
          fi

          if [ "${{ inputs.metadata_only }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --metadata-only=true"
          fi

          if [ "${{ inputs.force_refresh }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force=true"
          fi

          npm run backfill:lore -- \
            --from=${{ inputs.from_token }} \
            --to=${{ inputs.to_token }} \
            --concurrency=${{ inputs.concurrency }} \
            --metadata-timeout-ms=6500 \
            --image-timeout-ms=${{ inputs.image_timeout_ms }} \
            --image-race-width=${{ inputs.image_race_width }} \
            $EXTRA_ARGS

      - name: Run summary
        if: always()
        shell: bash
        run: |
          echo "## Tobyworld Lore Backfill" >> "$GITHUB_STEP_SUMMARY"
          echo "- Range: ${{ inputs.from_token }} → ${{ inputs.to_token }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers: ${{ inputs.concurrency }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artwork timeout: ${{ inputs.image_timeout_ms }} ms" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway race width: ${{ inputs.image_race_width }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retry artwork: ${{ inputs.retry_art }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Metadata only: ${{ inputs.metadata_only }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Force refresh: ${{ inputs.force_refresh }}" >> "$GITHUB_STEP_SUMMARY"
